quarkus.http.port=8088
#qroq.token=
quarkus.rest-client.logging.scope=request-response
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG

mp.messaging.incoming.bleeps.connector=smallrye-kafka
# Allow larger Kafka messages on the bleeps channel (base64 image payloads can be several MB)
mp.messaging.incoming.bleeps.max.request.size=10485760
# Matching consumer-side limit
mp.messaging.incoming.bleeps.max.partition.fetch.bytes=10485760
quarkus.kafka.devservices.enabled=true
# Broker-side: raise the message size limit on the Dev Services Kafka broker.
# Default provider is upstream Apache Kafka, configured via KAFKA_* env vars.
quarkus.kafka.devservices.container-env.KAFKA_MESSAGE_MAX_BYTES=10485760
quarkus.kafka.devservices.container-env.KAFKA_REPLICA_FETCH_MAX_BYTES=10485760
quarkus.kafka.devservices.container-env.KAFKA_SOCKET_REQUEST_MAX_BYTES=10485760

# The admin listens from its own start-up (see Planet) and reads what it has not seen yet.
mp.messaging.incoming.discussions.connector=smallrye-kafka
mp.messaging.incoming.discussions.auto.offset.reset=earliest
mp.messaging.incoming.bleeps.auto.offset.reset=earliest
# A message that cannot be read must not stop the stream.
mp.messaging.incoming.discussions.failure-strategy=ignore
mp.messaging.incoming.bleeps.failure-strategy=ignore
# First line of a conversation; %s is the avatar who says hi (override with HIPOLA_GREETING).
#hipola.greeting=Hi ! It's %s . How are you doing ?
# The front-end is edited often: never let the browser serve yesterday's JavaScript.
quarkus.http.static-resources.caching-enabled=false

# Voice from the sky: speech-to-text endpoint (OpenAI-compatible), model, and token (qroq.token).
# Groq by default; for OpenAI: url=https://api.openai.com/v1/audio/transcriptions and model=whisper-1
quarkus.rest-client.transcription.url=https://api.groq.com/openai/v1/audio/transcriptions
hipola.transcription.model=whisper-large-v3
