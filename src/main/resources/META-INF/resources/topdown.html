<!DOCTYPE html>
<html>
<head>
    <title>Planet Hipola - Prairie Dream World</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="phaser-container" id="phaser-container"></div>
        <div class="retro-buttons">
            <div class="game-instructions">
                <span class="retro-label">🎮 Use WASD or Arrow Keys to Move</span>
                <span class="retro-label">🌾 Explore the Endless Prairie</span>
                <span class="retro-label">💬 Chats Trigger When Lights Touch</span>
                <span class="retro-label">🌟 Watch for Connection Lines & Light Bursts</span>
            </div>
            <button id="chat" class="retro-btn">Start chat !</button>
            <button id="stop" class="retro-btn">Stop chat ...</button>
            <button id="addAvatar" class="retro-btn avatar-button">Add Avatar</button>
            <button id="recordButton" class="retro-btn record-button">Interact</button>
        </div>
        <div class="live-feed">
            <div class="live-feed-header"><h2>LIVE FEED</h2></div>
            <div id="live-feed"></div>
        </div>
    </div>
    <script src="topdown.js"></script>
    <script src="livefeed.js"></script>
    <script src="button-actions.js"></script>
    <script src="recorder.js"></script>
</body>
</html>
